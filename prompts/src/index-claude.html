<!DOCTYPE html>

<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000008;
    --panel: rgba(0,0,16,0.82);
    --border: rgba(80,140,255,0.28);
    --accent: #4a8fff;
    --accent2: #7ef4ff;
    --text: #d8e8ff;
    --muted: #6a88bb;
    --glow: rgba(74,143,255,0.35);
    --font-mono: 'Share Tech Mono', 'Courier New', monospace;
    --font-ui: 'Rajdhani', 'Courier New', sans-serif;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: var(--font-mono);
    color: var(--text);
    cursor: default;
  }

  #three-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* ─── TOP BAR ─── */
  #top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    background: linear-gradient(to bottom, rgba(0,0,20,0.95) 0%, rgba(0,0,20,0) 100%);
    pointer-events: none;
  }

  #app-title {
    font-family: var(--font-mono);
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    color: var(--accent2);
    text-shadow: 0 0 18px var(--accent2), 0 0 40px rgba(126,244,255,0.3);
    pointer-events: none;
    user-select: none;
  }

  #nav-btn {
    pointer-events: all;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 7px 16px;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
    text-transform: uppercase;
  }
  #nav-btn:hover {
    border-color: var(--accent);
    color: var(--accent2);
    box-shadow: 0 0 12px var(--glow);
  }

  /* ─── BOTTOM HUD ─── */
  #bottom-hud {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    display: flex; gap: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    padding: 6px 10px;
    transition: opacity 0.4s;
  }
  #bottom-hud.hidden { opacity: 0; pointer-events: none; }

  .hud-btn {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    background: none;
    border: 1px solid transparent;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .hud-btn:hover { color: var(--text); border-color: var(--border); }
  .hud-btn.active {
    color: var(--accent2);
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--glow);
    text-shadow: 0 0 8px var(--accent2);
  }

  /* ─── ZOOM CONTROLS ─── */
  #zoom-controls {
    position: fixed; bottom: 20px; right: 20px; z-index: 100;
    display: flex; flex-direction: column; gap: 4px;
  }
  .zoom-btn {
    font-family: var(--font-mono);
    font-size: 1rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }
  .zoom-btn:hover { color: var(--accent2); border-color: var(--accent); box-shadow: 0 0 10px var(--glow); }

  /* ─── TOOLTIP ─── */
  #tooltip {
    position: fixed; z-index: 200;
    pointer-events: none;
    background: rgba(0,5,30,0.88);
    border: 1px solid var(--border);
    padding: 5px 11px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: var(--accent2);
    backdrop-filter: blur(6px);
    display: none;
    white-space: nowrap;
    text-shadow: 0 0 8px var(--accent2);
  }

  /* ─── INFO PANEL ─── */
  #info-panel {
    position: fixed; top: 60px; left: 20px; z-index: 150;
    width: 280px;
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    padding: 20px;
    display: none;
    transition: opacity 0.3s;
  }
  #info-panel.visible { display: block; }

  #info-panel .obj-name {
    font-family: var(--font-ui);
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #fff;
    text-shadow: 0 0 14px var(--accent);
    margin-bottom: 2px;
    line-height: 1.1;
  }
  #info-panel .obj-type {
    font-size: 0.68rem;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  #info-panel .separator {
    width: 100%; height: 1px;
    background: linear-gradient(to right, var(--accent), transparent);
    margin-bottom: 14px;
  }
  #info-panel .fact-row {
    display: flex; justify-content: space-between;
    margin-bottom: 8px;
    gap: 10px;
  }
  #info-panel .fact-key {
    font-size: 0.65rem; letter-spacing: 0.12em;
    color: var(--muted); text-transform: uppercase;
    flex-shrink: 0;
  }
  #info-panel .fact-val {
    font-size: 0.7rem; letter-spacing: 0.06em;
    color: var(--text); text-align: right;
  }
  #info-panel .fun-fact {
    margin-top: 14px;
    font-size: 0.68rem;
    line-height: 1.5;
    color: var(--muted);
    border-left: 2px solid var(--accent);
    padding-left: 10px;

  /* ─── GALAXY MARKER LABEL ─── */
  #galaxy-marker-label {
    position: fixed; z-index: 110;
    pointer-events: none;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--accent2);
    text-shadow: 0 0 10px var(--accent2);
    display: none;
    transform: translate(-50%, -100%);
    padding-bottom: 4px;
    white-space: nowrap;
  }

  /* ─── SCANLINE OVERLAY ─── */
  #scanlines {
    position: fixed; inset: 0; z-index: 50;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,20,0.06) 2px,
      rgba(0,0,20,0.06) 4px
    );
  }

  /* ─── LOADING ─── */
  #loading {
    position: fixed; inset: 0; z-index: 300;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    transition: opacity 0.8s;
  }
  #loading.fade-out { opacity: 0; pointer-events: none; }
  #loading-title {
    font-family: var(--font-mono);
    font-size: 1.4rem;
    letter-spacing: 0.5em;
    color: var(--accent2);
    text-shadow: 0 0 20px var(--accent2);
  }
  #loading-bar-wrap {
    width: 200px; height: 2px;
    background: rgba(74,143,255,0.15);
    border: 1px solid var(--border);
  }
  #loading-bar {
    height: 100%; width: 0%;
    background: linear-gradient(to right, var(--accent), var(--accent2));
    transition: width 0.3s;
    box-shadow: 0 0 10px var(--accent2);
  }
  #loading-text {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Cursor pointer when hovering interactive objects */
  #three-canvas.hovering { cursor: pointer; }
</style>

/* Animation Machine */
const animMachine = {
  state: 'PLAYING',
  timeScale: 1,
  transitions: {
    PAUSED:  { PLAY: 'PLAYING' },
    PLAYING: { PAUSE: 'PAUSED', SPEED_UP: 'FAST' },
    FAST:    { SPEED_DOWN: 'PLAYING', PAUSE: 'PAUSED' },
  },
  send(event) {
    const next = this.transitions[this.state]?.[event];
    if (!next) return;
    this.state = next;
    if (next === 'PLAYING') this.timeScale = 1;
    else if (next === 'FAST') this.timeScale = 10;
    else if (next === 'PAUSED') this.timeScale = 0;
    updateHUDButtons();
  }
};

/* Object Machine factory */
function createObjectMachine(mesh, data, parentData) {
  const obj = {
    state: 'IDLE',
    mesh, data, parentData,
    transitions: {
      IDLE:     { MOUSE_ENTER: 'HOVERED' },
      HOVERED:  { MOUSE_LEAVE: 'IDLE', CLICK: 'SELECTED' },
      SELECTED: { DESELECT: 'IDLE', CLICK: 'SELECTED' },
    },
    send(event) {
      const next = this.transitions[this.state]?.[event];
      if (!next) return;
      this.state = next;
      this.onEnter(next);
    },
    onEnter(state) {
      const mat = this.mesh.material;
      if (state === 'IDLE') {
        if (mat.emissive) { mat.emissive.setHex(0x000000); mat.emissiveIntensity = 0; }
        hideTooltip();
        canvas.classList.remove('hovering');
      } else if (state === 'HOVERED') {
        if (mat.emissive) { mat.emissive.setHex(0xffffff); mat.emissiveIntensity = 0.3; }
        showTooltip(this.data.name, mouseX, mouseY);
        canvas.classList.add('hovering');
      } else if (state === 'SELECTED') {
        if (mat.emissive) { mat.emissive.setHex(0x88ccff); mat.emissiveIntensity = 0.6; }
        viewMachine.send('SELECT_OBJECT', { machine: this });
      }
    }
  };
  return obj;
}

/* View Machine */
const viewMachine = {
  state: 'SOLAR_SYSTEM',
  transitions: {
    GALAXY:        { ENTER_SOLAR_SYSTEM: 'SOLAR_SYSTEM' },
    SOLAR_SYSTEM:  { ZOOM_TO_GALAXY: 'GALAXY', SELECT_OBJECT: 'OBJECT_DETAIL' },
    OBJECT_DETAIL: { BACK: 'SOLAR_SYSTEM', SELECT_OBJECT: 'OBJECT_DETAIL' },
  },
  send(event, payload) {
    const next = this.transitions[this.state]?.[event];
    if (!next) return;
    this.state = next;
    this.onEnter(next, payload);
  },
  onEnter(state, payload) {
    updateNavBtn(state);
    if (state === 'GALAXY') {
      teardownSolarSystem();
      buildGalaxy();
      hideInfoPanel();
      document.getElementById('bottom-hud').classList.add('hidden');
    } else if (state === 'SOLAR_SYSTEM') {
      teardownGalaxy();
      if (!sceneGroup) buildSolarSystem();
      hideInfoPanel();
      document.getElementById('bottom-hud').classList.remove('hidden');
      animMachine.state = 'PLAYING'; animMachine.timeScale = 1;
      updateHUDButtons();
      lerpCameraTo(CAM_SOLAR.pos.clone(), CAM_SOLAR.target.clone(), 1.0);
    } else if (state === 'OBJECT_DETAIL') {
      // Deselect previous
      if (selectedMachine && selectedMachine !== payload.machine) {
        selectedMachine.send('DESELECT');
      }
      selectedMachine = payload.machine;
      detailTarget = { mesh: payload.machine.mesh, data: payload.machine.data };
      animMachine.send('PAUSE');
      showObjectDetail(detailTarget);
    }
  }
};

function loadTexture(url, fallbackColor) {
  return new Promise(resolve => {
    if (!url) { resolve(null); return; }
    textureLoader.load(url, tex => resolve(tex), undefined, () => resolve(null));
  });
}

function makeMaterial(tex, color, emissive, emissiveIntensity, isBasic) {
  if (isBasic) {
    return new THREE.MeshBasicMaterial({ map: tex || null, color: tex ? 0xffffff : color });
  }
  const mat = new THREE.MeshPhongMaterial({
    map: tex || null,
    color: tex ? 0xffffff : color,
    shininess: 8,
  });
  if (emissive !== undefined) { mat.emissive = new THREE.Color(emissive); mat.emissiveIntensity = emissiveIntensity || 0; }
  return mat;
}

// ══════════════════════════════════════════════
//  SOLAR SYSTEM BUILD
// ══════════════════════════════════════════════
function buildOrbitLine(radius, inclinationDeg, y) {
  const segments = 128;
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12 });
  const line = new THREE.Line(geo, mat);
  line.rotation.x = THREE.MathUtils.degToRad(inclinationDeg || 0);
  return line;
}

async function buildSolarSystem() {
  sceneGroup = new THREE.Group();
  scene.add(sceneGroup);

  // Lighting
  const sunLight = new THREE.PointLight(0xFFFFEE, 2.5, 800);
  sunLight.position.set(0,0,0);
  sceneGroup.add(sunLight);
  sceneGroup.add(new THREE.AmbientLight(0x111122, 1));

  // Load textures and build bodies
  for (const data of SOLAR_SYSTEM_DATA) {
    const tex = await loadTexture(data.textureUrl, data.color);
    const isBasic = data.type === 'star';
    const mat = makeMaterial(tex, data.color, data.emissive, data.emissiveIntensity, isBasic);
    const geo = new THREE.SphereGeometry(data.radius, 32, 32);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.z = THREE.MathUtils.degToRad(data.axialTilt || 0);
    mesh.userData = { orbitAngle: Math.random() * Math.PI * 2 };

    if (data.type === 'star') {
      // Sun glow
      const glowGeo = new THREE.SphereGeometry(data.radius * 1.18, 32, 32);
      const glowMat = new THREE.MeshBasicMaterial({ color:0xFFAA00, transparent:true, opacity:0.18, side:THREE.BackSide });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      sceneGroup.add(glow);
    }

    sceneGroup.add(mesh);
    const machine = createObjectMachine(mesh, data, null);
    solarSystemObjects.push({ mesh, data, machine });

    // Orbit line
    if (data.orbitRadius > 0) {
      const line = buildOrbitLine(data.orbitRadius, data.orbitInclination || 0);
      sceneGroup.add(line);
      orbitLines.push(line);
    }

    // Saturn rings
    if (data.rings) {
      const r = data.rings;
      const ringGeo = new THREE.RingGeometry(r.innerRadius, r.outerRadius, 64);
      // Fix UV for ring texture
      const uv = ringGeo.attributes.uv;
      const pos = ringGeo.attributes.position;
      for (let i = 0; i < uv.count; i++) {
        const vx = pos.getX(i), vz = pos.getZ(i);
        const d = Math.sqrt(vx*vx + vz*vz);
        uv.setX(i, (d - r.innerRadius) / (r.outerRadius - r.innerRadius));
      }
      const ringTex = await loadTexture(r.textureUrl, null);
      const ringMat = new THREE.MeshBasicMaterial({
        map: ringTex, color: ringTex ? 0xffffff : r.color,
        side: THREE.DoubleSide, transparent: true, opacity: r.opacity
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = Math.PI / 2;
      sceneGroup.add(ringMesh);
      data._ringMesh = ringMesh;
    }

    // Moons
    if (data.moons) {
      for (const moonData of data.moons) {
        const mTex = await loadTexture(moonData.textureUrl, moonData.color);
        const mMat = makeMaterial(mTex, moonData.color, 0x000000, 0, false);
        const mGeo = new THREE.SphereGeometry(moonData.radius, 20, 20);
        const mMesh = new THREE.Mesh(mGeo, mMat);
        mMesh.userData = { orbitAngle: Math.random() * Math.PI * 2 };
        sceneGroup.add(mMesh);
        const mMachine = createObjectMachine(mMesh, moonData, data);
        solarSystemObjects.push({ mesh: mMesh, data: moonData, machine: mMachine, parentData: data });
      }
    }
  }

  // Asteroid belt
  {
    const cfg = ASTEROID_BELT_CFG;
    const positions = [];
    for (let i = 0; i < cfg.count; i++) {
      const r = cfg.innerRadius + Math.random() * (cfg.outerRadius - cfg.innerRadius);
      const a = Math.random() * Math.PI * 2;
      const y = (Math.random() - 0.5) * 1.2;
      positions.push(Math.cos(a)*r, y, Math.sin(a)*r);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color: cfg.color, size: 0.12, sizeAttenuation: true });
    asteroidBelt = new THREE.Points(geo, mat);
    sceneGroup.add(asteroidBelt);
  }

  lerpCameraTo(CAM_SOLAR.pos.clone(), CAM_SOLAR.target.clone(), 0);
}

function teardownSolarSystem() {
  solarSystemObjects = [];
  orbitLines = [];
  asteroidBelt = null;
  if (sceneGroup) {
    sceneGroup.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => { if(m.map)m.map.dispose(); m.dispose(); });
        else { if(obj.material.map)obj.material.map.dispose(); obj.material.dispose(); }
      }
    });
    scene.remove(sceneGroup);
    sceneGroup = null;
  }
  hideInfoPanel();
  selectedMachine = null;
  detailTarget = null;
}

// ══════════════════════════════════════════════
//  GALAXY BUILD
// ══════════════════════════════════════════════
function buildGalaxy() {
  const group = new THREE.Group();
  scene.add(group);
  galaxyObjects.push(group);

  function makeParticles(count, colorHex, builder) {
    const positions = [];
    for (let i = 0; i < count; i++) builder(positions);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color: colorHex, size: 0.4, sizeAttenuation: true, transparent: true, opacity: 0.85 });
    return new THREE.Points(geo, mat);
  }

  // Galactic core
  const core = makeParticles(20000, 0xFFEECC, pos => {
    const r = Math.pow(Math.random(), 2) * 25;
    const theta = Math.random() * Math.PI * 2;
    const phi = (Math.random() - 0.5) * Math.PI * 0.15 * (1 - r/25);
    pos.push(r*Math.cos(theta)*Math.cos(phi), r*Math.sin(phi)*3, r*Math.sin(theta)*Math.cos(phi));
  });
  group.add(core);

  // 4 spiral arms
  const armColors = [0xAABBFF, 0x99AAFF, 0xBBCCFF, 0xAABBFF];
  for (let arm = 0; arm < 4; arm++) {
    const armOffset = (arm / 4) * Math.PI * 2;
    const pts = makeParticles(20000, armColors[arm], pos => {
      const t = Math.random();
      const r = 8 + t * 120;
      const spread = (1 - t) * 3 + t * 18;
      const a = armOffset + t * 4.5 + (Math.random() - 0.5) * 0.6;
      const x = r * Math.cos(a) + (Math.random()-0.5)*spread;
      const z = r * Math.sin(a) + (Math.random()-0.5)*spread;
      const y = (Math.random()-0.5) * (1 + t*6);
      pos.push(x, y, z);
    });
    group.add(pts);
  }

  // Disk haze
  const haze = makeParticles(30000, 0x334466, pos => {
    const r = 15 + Math.random() * 100;
    const a = Math.random() * Math.PI * 2;
    const y = (Math.random()-0.5) * (4 + r*0.06);
    pos.push(r*Math.cos(a), y, r*Math.sin(a));
  });
  haze.material.opacity = 0.4;
  group.add(haze);

  // Background stars
  const stars = makeParticles(10000, 0xffffff, pos => {
    const r = 200 + Math.random() * 300;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2*Math.random()-1);
    pos.push(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
  });
  stars.material.size = 0.3; stars.material.opacity = 0.6;
  group.add(stars);

  // Solar system marker (pulsing sphere)
  const markerGeo = new THREE.SphereGeometry(1.2, 16, 16);
  const markerMat = new THREE.MeshBasicMaterial({ color: 0x7ef4ff, transparent: true, opacity: 0.9 });
  galaxyMarkerMesh = new THREE.Mesh(markerGeo, markerMat);
  galaxyMarkerMesh.position.set(60, 4, 10);
  group.add(galaxyMarkerMesh);
  galaxyObjects.push(galaxyMarkerMesh);

  lerpCameraTo(CAM_GALAXY.pos.clone(), CAM_GALAXY.target.clone(), 0);

  document.getElementById('galaxy-marker-label').style.display = 'block';
  document.getElementById('bottom-hud').classList.add('hidden');
}

function teardownGalaxy() {
  document.getElementById('galaxy-marker-label').style.display = 'none';
  galaxyMarkerMesh = null;
  for (const obj of galaxyObjects) {
    if (obj.traverse) {
      obj.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose();
      });
    }
    scene.remove(obj);
  }
  galaxyObjects = [];
}

// ══════════════════════════════════════════════
//  CAMERA LERP
// ══════════════════════════════════════════════
let lerpPos = null, lerpTarget = null, lerpDuration = 0, lerpElapsed = 0;

function lerpCameraTo(pos, target, duration) {
  if (duration <= 0) {
    camera.position.copy(pos);
    controls.target.copy(target);
    controls.update();
    return;
  }
  lerpPos = pos; lerpTarget = target;
  lerpDuration = duration; lerpElapsed = 0;
  cameraLerpActive = true;
}

// ══════════════════════════════════════════════
//  OBJECT DETAIL VIEW
// ══════════════════════════════════════════════
function showObjectDetail(target) {
  const { mesh, data } = target;
  const wp = new THREE.Vector3();
  mesh.getWorldPosition(wp);
  const dist = data.radius * 4.5 + 2;
  const camPos = wp.clone().add(new THREE.Vector3(dist*0.7, dist*0.4, dist));
  lerpCameraTo(camPos, wp, 0.8);
  showInfoPanel(data);
}

function showInfoPanel(data) {
  const panel = document.getElementById('info-panel');
  const facts = data.facts || {};
  const funFact = facts.funFact || '';
  const entries = Object.entries(facts).filter(([k]) => k !== 'funFact').slice(0, 4);
  panel.innerHTML = `
    <div class="obj-name">${data.name}</div>
    <div class="obj-type">${data.type || 'celestial body'}</div>
    <div class="separator"></div>
    ${entries.map(([k,v]) => `<div class="fact-row"><span class="fact-key">${k}</span><span class="fact-val">${v}</span></div>`).join('')}
    ${funFact ? `<div class="fun-fact">${funFact}</div>` : ''}
  `;
  panel.classList.add('visible');
}

function hideInfoPanel() {
  document.getElementById('info-panel').classList.remove('visible');
  document.getElementById('info-panel').innerHTML = '';
}

// ══════════════════════════════════════════════
//  TOOLTIP
// ══════════════════════════════════════════════
function showTooltip(name, x, y) {
  const el = document.getElementById('tooltip');
  el.textContent = name;
  el.style.display = 'block';
  el.style.left = (x + 14) + 'px';
  el.style.top  = (y - 10) + 'px';
}
function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ══════════════════════════════════════════════
//  HUD
// ══════════════════════════════════════════════
function updateNavBtn(state) {
  const btn = document.getElementById('nav-btn');
  if (state === 'SOLAR_SYSTEM') {
    btn.style.display = 'block';
    btn.textContent = '🌌 Galaxy View';
    btn.onclick = () => viewMachine.send('ZOOM_TO_GALAXY');
  } else if (state === 'GALAXY') {
    btn.style.display = 'block';
    btn.textContent = '☀ Solar System';
    btn.onclick = () => viewMachine.send('ENTER_SOLAR_SYSTEM');
  } else if (state === 'OBJECT_DETAIL') {
    btn.style.display = 'block';
    btn.textContent = '← Back';
    btn.onclick = () => {
      if (selectedMachine) { selectedMachine.send('DESELECT'); selectedMachine = null; }
      hideInfoPanel();
      viewMachine.state = 'SOLAR_SYSTEM';
      updateNavBtn('SOLAR_SYSTEM');
      animMachine.send('PLAY');
      lerpCameraTo(CAM_SOLAR.pos.clone(), CAM_SOLAR.target.clone(), 0.8);
      document.getElementById('bottom-hud').classList.remove('hidden');
    };
  }
}

function updateHUDButtons() {
  ['btn-pause','btn-play','btn-fast'].forEach(id => document.getElementById(id).classList.remove('active'));
  if (animMachine.state === 'PAUSED') document.getElementById('btn-pause').classList.add('active');
  else if (animMachine.state === 'PLAYING') document.getElementById('btn-play').classList.add('active');
  else if (animMachine.state === 'FAST') document.getElementById('btn-fast').classList.add('active');
}

// ══════════════════════════════════════════════
//  RAYCASTING
// ══════════════════════════════════════════════
function doRaycast(isClick) {
  if (viewMachine.state === 'GALAXY') {
    // Check galaxy marker
    if (galaxyMarkerMesh) {
      mouseVec.set((mouseX/window.innerWidth)*2-1, -(mouseY/window.innerHeight)*2+1);
      raycaster.setFromCamera(mouseVec, camera);
      const hits = raycaster.intersectObject(galaxyMarkerMesh);
      if (hits.length > 0) {
        if (isClick) viewMachine.send('ENTER_SOLAR_SYSTEM');
        canvas.classList.add('hovering');
        showTooltip('Solar System', mouseX, mouseY);
        return;
      } else {
        canvas.classList.remove('hovering');
        hideTooltip();
      }
    }
    return;
  }

  if (!solarSystemObjects.length) return;
  mouseVec.set((mouseX/window.innerWidth)*2-1, -(mouseY/window.innerHeight)*2+1);
  raycaster.setFromCamera(mouseVec, camera);
  const meshes = solarSystemObjects.map(o => o.mesh);
  const hits = raycaster.intersectObjects(meshes, false);

  if (hits.length > 0) {
    const hit = hits[0];
    const found = solarSystemObjects.find(o => o.mesh === hit.object);
    if (found) {
      if (isClick) {
        found.machine.send('CLICK');
      } else {
        if (currentHoveredMachine && currentHoveredMachine !== found.machine) {
          currentHoveredMachine.send('MOUSE_LEAVE');
        }
        if (found.machine.state === 'IDLE') found.machine.send('MOUSE_ENTER');
        currentHoveredMachine = found.machine;
        // Update tooltip position
        if (found.machine.state === 'HOVERED') showTooltip(found.data.name, mouseX, mouseY);
      }
    }
  } else {
    if (currentHoveredMachine) {
      currentHoveredMachine.send('MOUSE_LEAVE');
      currentHoveredMachine = null;
      hideTooltip();
      canvas.classList.remove('hovering');
    }
    if (isClick) {
      // Click empty = deselect
      if (viewMachine.state === 'OBJECT_DETAIL') {
        document.getElementById('nav-btn').click();
      }
    }
  }
}

// ══════════════════════════════════════════════
//  ANIMATION LOOP
// ══════════════════════════════════════════════
const clock = new THREE.Clock();
let pulseT = 0;

function animate() {
  rafId = requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // Camera lerp
  if (cameraLerpActive) {
    lerpElapsed += dt;
    const t = Math.min(lerpElapsed / lerpDuration, 1);
    const et = t < 0.5 ? 2*t*t : -1+(4-2*t)*t; // ease in-out
    camera.position.lerp(lerpPos, et * 0.12 + dt * 2);
    controls.target.lerp(lerpTarget, et * 0.12 + dt * 2);
    if (t >= 1) cameraLerpActive = false;
  }

  controls.update();

  // Orbit animation
  if (sceneGroup && animMachine.timeScale > 0) {
    elapsed += dt * animMachine.timeScale;
    for (const obj of solarSystemObjects) {
      const { mesh, data, parentData } = obj;
      if (data.orbitRadius > 0) {
        const period = data.orbitPeriod * (parentData ? 0.1 : 1);
        const speed = (1 / (period > 0 ? period : 1)) * 0.5;
        mesh.userData.orbitAngle += dt * animMachine.timeScale * speed;
        const a = mesh.userData.orbitAngle;
        if (parentData) {
          // Moon: find parent mesh position
          const parentObj = solarSystemObjects.find(o => o.data.id === parentData.id);
          if (parentObj) {
            const pp = new THREE.Vector3();
            parentObj.mesh.getWorldPosition(pp);
            mesh.position.set(
              pp.x + Math.cos(a) * data.orbitRadius,
              pp.y,
              pp.z + Math.sin(a) * data.orbitRadius
            );
          }
        } else {
          const inc = THREE.MathUtils.degToRad(data.orbitInclination || 0);
          mesh.position.set(
            Math.cos(a) * data.orbitRadius,
            Math.sin(inc) * Math.sin(a) * data.orbitRadius * 0.3,
            Math.sin(a) * data.orbitRadius
          );
        }
        // Saturn rings follow planet
        if (data._ringMesh) {
          data._ringMesh.position.copy(mesh.position);
        }
      }
      // Axial rotation
      mesh.rotation.y += dt * animMachine.timeScale * 0.3;
    }
    // Asteroid belt slow rotation
    if (asteroidBelt) asteroidBelt.rotation.y += dt * 0.005;
  } else if (sceneGroup && viewMachine.state === 'OBJECT_DETAIL' && detailTarget) {
    // Slow rotate selected object
    detailTarget.mesh.rotation.y += dt * 0.3;
  }

  // Galaxy marker pulse
  if (galaxyMarkerMesh) {
    pulseT += dt * 2;
    const s = 1 + Math.sin(pulseT) * 0.25;
    galaxyMarkerMesh.scale.setScalar(s);
    galaxyMarkerMesh.material.opacity = 0.5 + Math.sin(pulseT) * 0.4;

    // Update label position
    const labelEl = document.getElementById('galaxy-marker-label');
    if (labelEl.style.display !== 'none') {
      const wp = galaxyMarkerMesh.position.clone().project(camera);
      const x = (wp.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-wp.y * 0.5 + 0.5) * window.innerHeight;
      labelEl.style.left = x + 'px';
      labelEl.style.top  = y + 'px';
    }
  }

  // Lazy raycasting
  if (raycasterDirty) {
    raycasterDirty = false;
    doRaycast(false);
  }

  renderer.render(scene, camera);
}

// ══════════════════════════════════════════════
//  EVENTS
// ══════════════════════════════════════════════
canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  raycasterDirty = true;
  // update tooltip pos if visible
  const tt = document.getElementById('tooltip');
  if (tt.style.display !== 'none') {
    tt.style.left = (e.clientX+14)+'px';
    tt.style.top  = (e.clientY-10)+'px';
  }
});

canvas.addEventListener('click', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  doRaycast(true);
});

document.getElementById('btn-pause').addEventListener('click', () => animMachine.send('PAUSE'));
document.getElementById('btn-play').addEventListener('click',  () => animMachine.send('PLAY'));
document.getElementById('btn-fast').addEventListener('click',  () => animMachine.send('SPEED_UP'));

document.getElementById('btn-zoom-in').addEventListener('click', () => {
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.addScaledVector(dir, -camera.position.distanceTo(controls.target) * 0.2);
  controls.update();
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.addScaledVector(dir, camera.position.distanceTo(controls.target) * 0.2);
  controls.update();
});
document.getElementById('btn-reset-cam').addEventListener('click', () => {
  const st = viewMachine.state;
  if (st === 'SOLAR_SYSTEM' || st === 'OBJECT_DETAIL') lerpCameraTo(CAM_SOLAR.pos.clone(), CAM_SOLAR.target.clone(), 0.8);
  else lerpCameraTo(CAM_GALAXY.pos.clone(), CAM_GALAXY.target.clone(), 0.8);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
async function init() {
  const loadingBar  = document.getElementById('loading-bar');
  const loadingText = document.getElementById('loading-text');

  loadingText.textContent = 'Calibrating orbital mechanics...';
  loadingBar.style.width = '20%';

  updateNavBtn('SOLAR_SYSTEM');
  updateHUDButtons();

  loadingBar.style.width = '40%';
  loadingText.textContent = 'Loading stellar textures...';

  await buildSolarSystem();

  loadingBar.style.width = '90%';
  loadingText.textContent = 'Aligning star charts...';

  document.getElementById('bottom-hud').classList.remove('hidden');

  await new Promise(r => setTimeout(r, 300));
  loadingBar.style.width = '100%';

  setTimeout(() => {
    const loading = document.getElementById('loading');
    loading.classList.add('fade-out');
    setTimeout(() => loading.remove(), 900);
  }, 400);

  animate();
}

init();
</script>
