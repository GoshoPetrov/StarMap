<style>

  }

    margin: 0;
    overflow: hidden;
    background: #000008;

    padding: 12px 18px;

  button:hover {

    position: fixed;
    right: 24px;
    bottom: 24px;

    flex-direction: column;
    gap: 10px;

    position: fixed;

    background: rgba(0,0,0,0.8);

    color: white;
    font-size: 12px;

    left: 20px;

    position: fixed;

    pointer-events: none;
    display: none;
    z-index: 5;
    text-shadow: 0 0 12px rgba(255,255,255,0.8);

</style>
</head>

<body>

<div id="topbar">

  </div>

</div>

<div id="zoom-controls">

  <button id="resetBtn">⟳</button>
</div>

<div id="tooltip"></div>

<div id="info-panel">

  <div id="info-type" class="type"></div>
  <div id="info-facts"></div>
</div>

<div id="solar-label">Solar System</div>

//////////////////////////////////////////////////////////////
// STATE MACHINES
//////////////////////////////////////////////////////////////

const animationMachine = {
  state: 'PLAYING',
  timeScale: 1,

  send(event) {

    if (event === 'PLAY') {
      this.state = 'PLAYING';
      this.timeScale = 1;
    }

    if (event === 'PAUSE') {
      this.state = 'PAUSED';
      this.timeScale = 0;
    }

    if (event === 'SPEED_UP') {
      this.state = 'FAST';
      this.timeScale = 10;
    }

    updateHUD();
  }
};

const viewMachine = {
  state: 'SOLAR_SYSTEM',

  send(event, payload) {

    if (this.state === 'GALAXY' && event === 'ENTER_SOLAR_SYSTEM') {
      this.state = 'SOLAR_SYSTEM';
      enterSolarSystem();
    }

    if (this.state === 'SOLAR_SYSTEM' && event === 'ZOOM_TO_GALAXY') {
      this.state = 'GALAXY';
      enterGalaxy();
    }

    if (this.state === 'SOLAR_SYSTEM' && event === 'SELECT_OBJECT') {
      this.state = 'OBJECT_DETAIL';
      enterObjectDetail(payload);
    }

    if (this.state === 'OBJECT_DETAIL' && event === 'BACK') {
      this.state = 'SOLAR_SYSTEM';
      exitObjectDetail();
    }

    if (this.state === 'OBJECT_DETAIL' && event === 'SELECT_OBJECT') {
      enterObjectDetail(payload);
    }

    updateHUD();
  }
};

function createObjectMachine(mesh, data) {

  return {

    state: 'IDLE',
    mesh,
    data,

    send(event) {

      if (event === 'MOUSE_ENTER') {

        this.state = 'HOVERED';

        mesh.material.emissive.setHex(0xffffff);
        mesh.material.emissiveIntensity = 0.3;

        showTooltip(data.name);
      }

      if (event === 'MOUSE_LEAVE') {

        this.state = 'IDLE';

        mesh.material.emissiveIntensity = 0;

        hideTooltip();
      }

      if (event === 'CLICK') {

        this.state = 'SELECTED';

        mesh.material.emissiveIntensity = 0.6;

        selectedMachine = this;

        viewMachine.send('SELECT_OBJECT', this);
      }

      if (event === 'DESELECT') {

        this.state = 'IDLE';

        mesh.material.emissiveIntensity = 0;
      }
    }
  };
}

//////////////////////////////////////////////////////////////
// INIT
//////////////////////////////////////////////////////////////

init();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    5000
  );

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000008);

  document.body.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);

  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  clock = new THREE.Clock();

  setupEvents();
  setupHUD();

  enterSolarSystem();

  animate();
}

//////////////////////////////////////////////////////////////
// SOLAR SYSTEM
//////////////////////////////////////////////////////////////

function buildSolarSystem() {

  solarSystemGroup = new THREE.Group();

  scene.add(solarSystemGroup);

  interactableObjects = [];
  objectMachines.clear();

  const ambient = new THREE.AmbientLight(0x111111);
  solarSystemGroup.add(ambient);

  const light = new THREE.PointLight(0xffffee, 2, 500);
  solarSystemGroup.add(light);

  SOLAR_SYSTEM.forEach(body => {

    const pivot = new THREE.Object3D();

    solarSystemGroup.add(pivot);

    body.pivot = pivot;

    const geometry = new THREE.SphereGeometry(body.radius, 48, 48);

    let material;

    if (body.id === 'sun') {

      material = new THREE.MeshBasicMaterial({
        color: body.color
      });

    } else {

      material = new THREE.MeshPhongMaterial({
        color: body.color,
        emissive: 0x000000
      });

      loadTexture(body.textureUrl, material);
    }

    const mesh = new THREE.Mesh(geometry, material);

    mesh.position.x = body.orbitRadius;

    mesh.userData.body = body;

    pivot.add(mesh);

    body.mesh = mesh;

    createOrbit(body.orbitRadius);

    if (body.rings) {
      createRings(mesh, body);
    }

    if (body.moons) {

      body.moons.forEach(moon => {

        const moonPivot = new THREE.Object3D();

        mesh.add(moonPivot);

        moon.pivot = moonPivot;

        const moonGeo = new THREE.SphereGeometry(moon.radius, 24, 24);

        const moonMat = new THREE.MeshPhongMaterial({
          color: moon.color,
          emissive: 0x000000
        });

        if (moon.textureUrl) {
          loadTexture(moon.textureUrl, moonMat);
        }

        const moonMesh = new THREE.Mesh(moonGeo, moonMat);

        moonMesh.position.x = moon.orbitRadius;

        moonPivot.add(moonMesh);

        moon.mesh = moonMesh;

        registerInteractable(moonMesh, moon);
      });
    }

    registerInteractable(mesh, body);
  });

  createAsteroidBelt();

  camera.position.set(0, 60, 140);

  controls.target.set(0, 0, 0);

  controls.minDistance = 5;
  controls.maxDistance = 600;
}

function createOrbit(radius) {

  if (radius === 0) return;

  const curve = new THREE.EllipseCurve(
    0,
    0,
    radius,
    radius,
    0,
    Math.PI * 2
  );

  const points = curve.getPoints(128);

  const geometry = new THREE.BufferGeometry().setFromPoints(
    points.map(p => new THREE.Vector3(p.x, 0, p.y))
  );

  const material = new THREE.LineBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.15
  });

  const line = new THREE.LineLoop(geometry, material);

  solarSystemGroup.add(line);
}

function createRings(mesh, body) {

  const geo = new THREE.RingGeometry(
    body.rings.innerRadius,
    body.rings.outerRadius,
    64
  );

  const tex = textureLoader.load(TEX.saturnRing);

  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.7
  });

  const rings = new THREE.Mesh(geo, mat);

  rings.rotation.x = Math.PI / 2;

  mesh.add(rings);
}

function createAsteroidBelt() {

  const count = 2000;

  const positions = [];

  for (let i = 0; i < count; i++) {

    const radius = THREE.MathUtils.randFloat(35, 48);

    const angle = Math.random() * Math.PI * 2;

    const y = THREE.MathUtils.randFloatSpread(1);

    positions.push(
      Math.cos(angle) * radius,
      y,
      Math.sin(angle) * radius
    );
  }

  const geometry = new THREE.BufferGeometry();

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );

  const material = new THREE.PointsMaterial({
    color: 0x888888,
    size: 0.08
  });

  asteroidBelt = new THREE.Points(geometry, material);

  solarSystemGroup.add(asteroidBelt);
}

//////////////////////////////////////////////////////////////
// GALAXY
//////////////////////////////////////////////////////////////

function buildGalaxy() {

  galaxyGroup = new THREE.Group();

  scene.add(galaxyGroup);

  createGalaxyCore();
  createSpiralArms();
  createGalaxyHaze();
  createBackgroundStars();
  createSolarMarker();

  camera.position.set(0, 220, 320);

  controls.target.set(0, 0, 0);

  controls.minDistance = 20;
  controls.maxDistance = 2000;
}

function createGalaxyCore() {

  const geometry = new THREE.BufferGeometry();

  const positions = [];

  for (let i = 0; i < 20000; i++) {

    const r = Math.pow(Math.random(), 2) * 20;

    const angle = Math.random() * Math.PI * 2;

    positions.push(
      Math.cos(angle) * r,
      THREE.MathUtils.randFloatSpread(3),
      Math.sin(angle) * r
    );
  }

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );

  const material = new THREE.PointsMaterial({
    color: 0xFFEECC,
    size: 0.25
  });

  galaxyGroup.add(new THREE.Points(geometry, material));
}

function createSpiralArms() {

  const geometry = new THREE.BufferGeometry();

  const positions = [];

  const arms = 4;

  for (let arm = 0; arm < arms; arm++) {

    const armOffset = (Math.PI * 2 / arms) * arm;

    for (let i = 0; i < 20000; i++) {

      const radius = Math.random() * 140;

      const theta = armOffset + radius * 0.18;

      let x = Math.cos(theta) * radius;
      let z = Math.sin(theta) * radius;

      x += THREE.MathUtils.randFloatSpread(6);
      z += THREE.MathUtils.randFloatSpread(6);

      const y = THREE.MathUtils.randFloatSpread(2);

      positions.push(x, y, z);
    }
  }

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );

  const material = new THREE.PointsMaterial({
    color: 0xAABBFF,
    size: 0.18
  });

  galaxyGroup.add(new THREE.Points(geometry, material));
}

function createGalaxyHaze() {

  const geometry = new THREE.BufferGeometry();

  const positions = [];

  for (let i = 0; i < 30000; i++) {

    const radius = Math.random() * 170;

    const angle = Math.random() * Math.PI * 2;

    positions.push(
      Math.cos(angle) * radius,
      THREE.MathUtils.randFloatSpread(10),
      Math.sin(angle) * radius
    );
  }

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );

  const material = new THREE.PointsMaterial({
    color: 0x334466,
    size: 0.12,
    transparent: true,
    opacity: 0.4
  });

  galaxyGroup.add(new THREE.Points(geometry, material));
}

function createBackgroundStars() {

  const geometry = new THREE.BufferGeometry();

  const positions = [];

  for (let i = 0; i < 10000; i++) {

    const radius = 2000;

    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);

    positions.push(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );

  const material = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.8
  });

  galaxyGroup.add(new THREE.Points(geometry, material));
}

function createSolarMarker() {

  const geometry = new THREE.SphereGeometry(1.2, 24, 24);

  const material = new THREE.MeshBasicMaterial({
    color: 0x88bbff
  });

  solarMarker = new THREE.Mesh(geometry, material);

  solarMarker.position.set(60, 0, 20);

  galaxyGroup.add(solarMarker);

  registerInteractable(solarMarker, {
    name: 'Solar System',
    type: 'marker',
    facts: {}
  });
}

//////////////////////////////////////////////////////////////
// INTERACTION
//////////////////////////////////////////////////////////////

function registerInteractable(mesh, data) {

  interactableObjects.push(mesh);

  const machine = createObjectMachine(mesh, data);

  objectMachines.set(mesh.uuid, machine);
}

function setupEvents() {

  window.addEventListener('mousemove', e => {

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    document.getElementById('tooltip').style.left = e.clientX + 14 + 'px';
    document.getElementById('tooltip').style.top = e.clientY + 14 + 'px';

    needsRaycast = true;
  });

  window.addEventListener('click', onClick);

  window.addEventListener('resize', onResize);
}

function performRaycast() {

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(interactableObjects);

  if (hits.length > 0) {

    const mesh = hits[0].object;

    const machine = objectMachines.get(mesh.uuid);

    if (hoveredMachine && hoveredMachine !== machine) {
      hoveredMachine.send('MOUSE_LEAVE');
    }

    hoveredMachine = machine;

    machine.send('MOUSE_ENTER');

  } else {

    if (hoveredMachine) {
      hoveredMachine.send('MOUSE_LEAVE');
    }

    hoveredMachine = null;
  }
}

function onClick() {

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(interactableObjects);

  if (hits.length > 0) {

    const mesh = hits[0].object;

    const machine = objectMachines.get(mesh.uuid);

    if (machine.data.type === 'marker') {

      viewMachine.send('ENTER_SOLAR_SYSTEM');

      return;
    }

    machine.send('CLICK');

  } else {

    if (selectedMachine) {
      selectedMachine.send('DESELECT');
      selectedMachine = null;
    }
  }
}

//////////////////////////////////////////////////////////////
// DETAIL VIEW
//////////////////////////////////////////////////////////////

function enterObjectDetail(machine) {

  animationMachine.send('PAUSE');

  const mesh = machine.mesh;

  scene.traverse(obj => {

    if (
      obj.material &&
      obj !== mesh &&
      obj.material.opacity !== undefined
    ) {
      obj.material.transparent = true;
      obj.material.opacity = 0.1;
    }
  });

  const radius = machine.data.radius || 1;

  const offset = new THREE.Vector3(
    radius * 6,
    radius * 2.5,
    radius * 6
  );

  const targetPos = mesh.getWorldPosition(new THREE.Vector3());

  new TWEEN.Tween(camera.position)
    .to({
      x: targetPos.x + offset.x,
      y: targetPos.y + offset.y,
      z: targetPos.z + offset.z
    }, 1200)
    .easing(TWEEN.Easing.Cubic.InOut)
    .start();

  new TWEEN.Tween(controls.target)
    .to({
      x: targetPos.x,
      y: targetPos.y,
      z: targetPos.z
    }, 1200)
    .easing(TWEEN.Easing.Cubic.InOut)
    .start();

  showInfo(machine.data);
}

function exitObjectDetail() {

  animationMachine.send('PLAY');

  scene.traverse(obj => {

    if (obj.material) {

      obj.material.opacity = 1;
      obj.material.transparent = false;
    }
  });

  hideInfo();

  camera.position.set(0, 60, 140);

  controls.target.set(0,0,0);
}

//////////////////////////////////////////////////////////////
// UI
//////////////////////////////////////////////////////////////

function setupHUD() {

  document.getElementById('galaxyBtn').onclick = () => {
    viewMachine.send('ZOOM_TO_GALAXY');
  };

  document.getElementById('solarBtn').onclick = () => {
    viewMachine.send('ENTER_SOLAR_SYSTEM');
  };

  document.getElementById('backBtn').onclick = () => {
    viewMachine.send('BACK');
  };

  document.getElementById('pauseBtn').onclick = () => {
    animationMachine.send('PAUSE');
  };

  document.getElementById('playBtn').onclick = () => {
    animationMachine.send('PLAY');
  };

  document.getElementById('fastBtn').onclick = () => {
    animationMachine.send('SPEED_UP');
  };

  document.getElementById('zoomInBtn').onclick = () => {
    camera.position.multiplyScalar(0.9);
  };

  document.getElementById('zoomOutBtn').onclick = () => {
    camera.position.multiplyScalar(1.1);
  };

  document.getElementById('resetBtn').onclick = () => {

    if (viewMachine.state === 'GALAXY') {

      camera.position.set(0,220,320);

    } else {

      camera.position.set(0,60,140);
    }
  };

  updateHUD();
}

function updateHUD() {

  const galaxyBtn = document.getElementById('galaxyBtn');
  const solarBtn = document.getElementById('solarBtn');
  const backBtn = document.getElementById('backBtn');

  galaxyBtn.style.display =
    viewMachine.state === 'SOLAR_SYSTEM' ? 'block' : 'none';

  solarBtn.style.display =
    viewMachine.state === 'GALAXY' ? 'block' : 'none';

  backBtn.style.display =
    viewMachine.state === 'OBJECT_DETAIL' ? 'block' : 'none';

  document.getElementById('hud').style.display =
    viewMachine.state === 'GALAXY' ? 'none' : 'flex';

  document.getElementById('pauseBtn').classList.remove('active');
  document.getElementById('playBtn').classList.remove('active');
  document.getElementById('fastBtn').classList.remove('active');

  if (animationMachine.state === 'PAUSED') {
    document.getElementById('pauseBtn').classList.add('active');
  }

  if (animationMachine.state === 'PLAYING') {
    document.getElementById('playBtn').classList.add('active');
  }

  if (animationMachine.state === 'FAST') {
    document.getElementById('fastBtn').classList.add('active');
  }
}

function showTooltip(text) {

  const el = document.getElementById('tooltip');

  el.innerText = text;

  el.style.display = 'block';
}

function hideTooltip() {

  document.getElementById('tooltip').style.display = 'none';
}

function showInfo(data) {

  document.getElementById('info-panel').style.display = 'block';

  document.getElementById('info-name').innerText = data.name;

  document.getElementById('info-type').innerText =
    data.type.replace('_', ' ').toUpperCase();

  const factsEl = document.getElementById('info-facts');

  factsEl.innerHTML = '';

  Object.entries(data.facts).slice(0,4).forEach(([k,v]) => {

    const div = document.createElement('div');

    div.className = 'fact';

    div.innerHTML = `<span>${k}:</span> ${v}`;

    factsEl.appendChild(div);
  });
}

function hideInfo() {

  document.getElementById('info-panel').style.display = 'none';
}

//////////////////////////////////////////////////////////////
// SCENE SWITCHING
//////////////////////////////////////////////////////////////

function enterSolarSystem() {

  disposeGroup(galaxyGroup);

  buildSolarSystem();

  updateHUD();
}

function enterGalaxy() {

  disposeGroup(solarSystemGroup);

  buildGalaxy();

  updateHUD();
}

//////////////////////////////////////////////////////////////
// UTIL
//////////////////////////////////////////////////////////////

function loadTexture(url, material) {

  textureLoader.load(
    url,
    tex => {
      material.map = tex;
      material.needsUpdate = true;
    },
    undefined,
    () => {}
  );
}

function disposeGroup(group) {

  if (!group) return;

  group.traverse(obj => {

    if (obj.geometry) obj.geometry.dispose();

    if (obj.material) {

      if (Array.isArray(obj.material)) {

        obj.material.forEach(m => disposeMaterial(m));

      } else {

        disposeMaterial(obj.material);
      }
    }
  });

  scene.remove(group);
}

function disposeMaterial(material) {

  Object.keys(material).forEach(key => {

    const value = material[key];

    if (value && value.isTexture) {
      value.dispose();
    }
  });

  material.dispose();
}

function onResize() {

  camera.aspect = window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
}

//////////////////////////////////////////////////////////////
// UPDATE
//////////////////////////////////////////////////////////////

function updateSolarSystem(delta, elapsed) {

  SOLAR_SYSTEM.forEach(body => {

    if (body.pivot && body.orbitPeriod > 0) {

      const speed =
        (1 / body.orbitPeriod) * 0.5;

      body.pivot.rotation.y +=
        delta * speed * animationMachine.timeScale;
    }

    if (body.mesh) {

      body.mesh.rotation.y += delta * 0.2;
    }

    if (body.moons) {

      body.moons.forEach(moon => {

        if (moon.pivot) {

          const speed =
            (1 / moon.orbitPeriod) * 0.6;

          moon.pivot.rotation.y +=
            delta * speed * animationMachine.timeScale;
        }

        if (moon.mesh) {
          moon.mesh.rotation.y += delta * 0.2;
        }
      });
    }
  });

  if (asteroidBelt) {
    asteroidBelt.rotation.y += delta * 0.01;
  }
}

function updateGalaxy(delta, elapsed) {

  if (solarMarker) {

    const pulse = 1 + Math.sin(elapsed * 3) * 0.2;

    solarMarker.scale.setScalar(pulse);

    const vector = solarMarker.position.clone();

    vector.project(camera);

    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;

    const label = document.getElementById('solar-label');

    label.style.display = 'block';
    label.style.left = x + 'px';
    label.style.top = y + 'px';
  }
}

//////////////////////////////////////////////////////////////
// LOOP
//////////////////////////////////////////////////////////////

function animate() {

  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const elapsed = clock.elapsedTime;

  controls.update();

  TWEEN.update();

  if (viewMachine.state === 'SOLAR_SYSTEM' ||
      viewMachine.state === 'OBJECT_DETAIL') {

    updateSolarSystem(delta, elapsed);
  }

  if (viewMachine.state === 'GALAXY') {

    updateGalaxy(delta, elapsed);

  } else {

    document.getElementById('solar-label').style.display = 'none';
  }

  if (needsRaycast) {

    performRaycast();

    needsRaycast = false;
  }

  renderer.render(scene, camera);
}
