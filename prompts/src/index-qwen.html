<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>★ STAR MAP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000008; color: #fff;
      font-family: 'Courier New', monospace;
      user-select: none;
    }
    #three-canvas { display: block; width: 100%; height: 100%; }
    
    /* HUD Container */
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    #hud > * { pointer-events: auto; }
    
    /* Top Bar */
    #top-bar {
      position: absolute; top: 15px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 15px;
      background: rgba(0,0,10,0.7);
      border: 1px solid rgba(100,150,255,0.3);
      border-radius: 4px;
      font-size: 14px;
    }
    #app-title { font-weight: bold; letter-spacing: 1px; }
    #nav-buttons button {
      background: transparent; border: 1px solid rgba(255,255,255,0.5);
      color: #fff; padding: 6px 12px; margin-left: 8px;
      border-radius: 3px; cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    #nav-buttons button:hover {
      background: rgba(100,150,255,0.2);
      box-shadow: 0 0 8px rgba(100,150,255,0.5);
    }
    #nav-buttons button.active {
      background: rgba(100,150,255,0.4);
      border-color: #6496ff;
      box-shadow: 0 0 12px rgba(100,150,255,0.8);
    }
    
    /* Animation Controls */
    #anim-controls {
      position: absolute; bottom: 20px; left: 20px;
      display: flex; gap: 8px;
      padding: 10px 15px;
      background: rgba(0,0,10,0.7);
      border: 1px solid rgba(100,150,255,0.3);
      border-radius: 4px;
    }
    #anim-controls button {
      background: transparent; border: 1px solid rgba(255,255,255,0.5);
      color: #fff; padding: 6px 14px; border-radius: 3px;
      cursor: pointer; font-family: inherit; font-size: 13px;
      transition: all 0.2s;
    }
    #anim-controls button:hover {
      background: rgba(100,150,255,0.2);
      box-shadow: 0 0 8px rgba(100,150,255,0.5);
    }
    #anim-controls button.active {
      background: rgba(100,150,255,0.4);
      border-color: #6496ff;
      box-shadow: 0 0 12px rgba(100,150,255,0.8);
    }
    
    /* Zoom Controls */
    #zoom-controls {
      position: absolute; bottom: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 8px;
    }
    #zoom-controls button {
      width: 40px; height: 40px;
      background: rgba(0,0,10,0.7);
      border: 1px solid rgba(100,150,255,0.3);
      color: #fff; border-radius: 50%;
      cursor: pointer; font-size: 18px;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    #zoom-controls button:hover {
      background: rgba(100,150,255,0.2);
      box-shadow: 0 0 8px rgba(100,150,255,0.5);
    }
    
    /* Tooltip */
    #tooltip {
      position: absolute; padding: 6px 10px;
      background: rgba(0,0,10,0.85);
      border: 1px solid rgba(100,150,255,0.4);
      border-radius: 3px; font-size: 12px;
      pointer-events: none; display: none;
      max-width: 200px; white-space: nowrap;
      transform: translate(15px, 15px);
    }
    
    /* Info Panel */
    #info-panel {
      position: absolute; top: 70px; left: 20px;
      width: 280px; padding: 15px;
      background: rgba(0,0,10,0.85);
      border: 1px solid rgba(100,150,255,0.4);
      border-radius: 6px; display: none;
      font-size: 13px; line-height: 1.5;
    }
    #info-panel h3 {
      margin-bottom: 8px; font-size: 18px;
      border-bottom: 1px solid rgba(100,150,255,0.3);
      padding-bottom: 6px;
    }
    #info-panel .type {
      color: #6496ff; font-style: italic; margin-bottom: 10px;
    }
    #info-panel .facts { margin: 10px 0; }
    #info-panel .fact {
      display: flex; justify-content: space-between;
      margin: 4px 0; font-size: 12px;
    }
    #info-panel .fact-key { color: #aaa; }
    #info-panel .fact-val { color: #fff; font-weight: 500; }
    #info-panel .fun-fact {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px dashed rgba(100,150,255,0.3);
      font-style: italic; color: #ccc; font-size: 12px;
    }
    #info-panel #back-btn {
      margin-top: 12px; width: 100%;
      background: rgba(100,150,255,0.2);
      border: 1px solid #6496ff; color: #fff;
      padding: 8px; border-radius: 4px;
      cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    #info-panel #back-btn:hover {
      background: rgba(100,150,255,0.4);
      box-shadow: 0 0 10px rgba(100,150,255,0.6);
    }
    
    /* Hidden class */
    .hidden { display: none !important; }
    
    /* Loading indicator */
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px; color: #6496ff;
      text-shadow: 0 0 10px rgba(100,150,255,0.7);
    }
  </style>
</head>

      {

        orbitRadius: 190, orbitPeriod: 248.0, axialTilt: 122.53,
        orbitInclination: 17,
        facts: {
          diameter: '2,377 km', dayLength: '6.4 Earth days',
          distanceFromSun: '5.9B km (avg)', moons: 5,

    const ASTEROID_BELT = {
      innerRadius: 35, outerRadius: 48, count: 2000,
      color: 0x888888, sizeRange: [0.05, 0.2]
    };

    const GALAXY_CONFIG = {
      core: { count: 20000, color: 0xFFEECC, radius: 15 },
      arms: { count: 80000, color: 0xAABBFF, arms: 4, spread: 0.3 },
      disk: { count: 30000, color: 0x334466, height: 3 },
      stars: { count: 10000, color: 0xFFFFFF, radius: 200 }
    };

    // ==================== STATE MACHINES ====================
    const viewMachine = {
      state: 'SOLAR_SYSTEM',
      transitions: {
        GALAXY: { ENTER_SOLAR_SYSTEM: 'SOLAR_SYSTEM' },
        SOLAR_SYSTEM: { ZOOM_TO_GALAXY: 'GALAXY', SELECT_OBJECT: 'OBJECT_DETAIL' },
        OBJECT_DETAIL: { BACK: 'SOLAR_SYSTEM', SELECT_OBJECT: 'OBJECT_DETAIL' }
      },
      send(event, payload) {
        const next = this.transitions[this.state]?.[event];
        if (!next) return;
        this.state = next;
        this.onEnter(next, payload);
      },
      onEnter(state, payload) {
        if (state === 'GALAXY') {
          buildGalaxyScene();
          document.getElementById('anim-controls').classList.add('hidden');
          document.getElementById('btn-solar').classList.remove('hidden');
          document.getElementById('btn-galaxy').classList.add('hidden');
          document.getElementById('btn-back').classList.add('hidden');
        } else if (state === 'SOLAR_SYSTEM') {
          buildSolarSystemScene();
          document.getElementById('anim-controls').classList.remove('hidden');
          document.getElementById('btn-solar').classList.add('hidden');
          document.getElementById('btn-galaxy').classList.remove('hidden');
          document.getElementById('btn-back').classList.add('hidden');
          updateAnimationButtons();
        } else if (state === 'OBJECT_DETAIL') {
          showObjectDetail(payload);
          document.getElementById('btn-back').classList.remove('hidden');
          document.getElementById('btn-galaxy').classList.add('hidden');
          document.getElementById('btn-solar').classList.add('hidden');
        }
        updateHUD();
      }
    };

    const animationMachine = {
      state: 'PLAYING',
      timeScale: 1,
      transitions: {
        PAUSED: { PLAY: 'PLAYING', SPEED_UP: 'FAST' },
        PLAYING: { PAUSE: 'PAUSED', SPEED_UP: 'FAST' },
        FAST: { SPEED_DOWN: 'PLAYING', PAUSE: 'PAUSED' }
      },
      send(event) {
        const next = this.transitions[this.state]?.[event];
        if (!next) return;
        this.state = next;
        if (next === 'PAUSED') this.timeScale = 0;
        else if (next === 'PLAYING') this.timeScale = 1;
        else if (next === 'FAST') this.timeScale = 10;
        updateAnimationButtons();
      }
    };

    function createObjectMachine(object3D, data) {
      return {
        state: 'IDLE',
        data,
        transitions: {
          IDLE: { MOUSE_ENTER: 'HOVERED' },
          HOVERED: { MOUSE_LEAVE: 'IDLE', CLICK: 'SELECTED' },
          SELECTED: { DESELECT: 'IDLE', CLICK: 'SELECTED' }
        },
        send(event) {
          const next = this.transitions[this.state]?.[event];
          if (!next) return;
          const prev = this.state;
          this.state = next;
          this.onEnter(next, prev);
        },
        onEnter(state, prev) {
          const mat = object3D.material;
          if (!mat) return;
          
          if (state === 'IDLE') {
            if (mat.emissive) mat.emissive.setHex(0x000000);
            if (mat.emissiveIntensity !== undefined) mat.emissiveIntensity = 0;
            tooltip.style.display = 'none';
            canvas.style.cursor = 'default';
          } else if (state === 'HOVERED') {
            if (mat.emissive) mat.emissive.setHex(0xffffff);
            if (mat.emissiveIntensity !== undefined) mat.emissiveIntensity = 0.3;
            showTooltip(data.name);
            canvas.style.cursor = 'pointer';
          } else if (state === 'SELECTED') {
            if (mat.emissive) mat.emissive.setHex(0xffffff);
            if (mat.emissiveIntensity !== undefined) mat.emissiveIntensity = 0.6;
            tooltip.style.display = 'none';
            viewMachine.send('SELECT_OBJECT', data);
          }
        }
      };
    }

    // ==================== GLOBALS ====================
    let scene, camera, renderer, controls;
    let solarSystemScene, galaxyScene;
    let currentScene = null;
    let interactableObjects = [];
    let objectMachines = new Map();
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let clock = new THREE.Clock();
    let asteroidPoints, galaxyParticles = {};
    let solarSystemGroup, galaxyGroup;
    let selectedObjectData = null;
    let detailCameraTarget = null;
    let detailOriginalOpacities = new Map();
    let isTransitioning = false;

    const canvas = document.getElementById('three-canvas');
    const tooltip = document.getElementById('tooltip');
    const infoPanel = document.getElementById('info-panel');
    const loadingEl = document.getElementById('loading');

    // ==================== INIT ====================
    function init() {
      // Renderer
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x000008);

      // Camera
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
      
      // Controls
      controls = new THREE.OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 5;
      controls.maxDistance = 2000;

      // Events
      window.addEventListener('resize', onWindowResize);
      canvas.addEventListener('mousemove', onMouseMove);
      canvas.addEventListener('click', onClick);
      document.getElementById('btn-pause').onclick = () => animationMachine.send('PAUSE');
      document.getElementById('btn-play').onclick = () => animationMachine.send('PLAY');
      document.getElementById('btn-fast').onclick = () => animationMachine.send('SPEED_UP');
      document.getElementById('btn-zoom-in').onclick = () => zoomCamera(0.85);
      document.getElementById('btn-zoom-out').onclick = () => zoomCamera(1.15);
      document.getElementById('btn-zoom-reset').onclick = resetCamera;
      document.getElementById('btn-galaxy').onclick = () => viewMachine.send('ZOOM_TO_GALAXY');
      document.getElementById('btn-solar').onclick = () => viewMachine.send('ENTER_SOLAR_SYSTEM');
      document.getElementById('btn-back').onclick = () => {
        if (viewMachine.state === 'OBJECT_DETAIL') {
          viewMachine.send('BACK');
        }
      };
      document.getElementById('back-btn').onclick = () => viewMachine.send('BACK');

      // Start with solar system
      viewMachine.onEnter('SOLAR_SYSTEM');
      loadingEl.classList.add('hidden');
      
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ==================== SCENE BUILDERS ====================
    function teardownScene() {
      if (!currentScene) return;
      
      // Dispose interactable objects
      interactableObjects.forEach(obj => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) {
            obj.material.forEach(m => {
              if (m.map) m.map.dispose();
              m.dispose();
            });
          } else {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        }
      });
      
      // Dispose particles
      if (asteroidPoints) {
        asteroidPoints.geometry.dispose();
        asteroidPoints.material.dispose();
      }
      Object.values(galaxyParticles).forEach(p => {
        if (p?.geometry) p.geometry.dispose();
        if (p?.material) p.material.dispose();
      });
      
      // Clear scene
      currentScene.traverse(obj => {
        if (obj.isMesh && obj.material?.map) obj.material.map.dispose();
      });
      
      interactableObjects = [];
      objectMachines.clear();
      asteroidPoints = null;
      galaxyParticles = {};
      
      // Reset camera
      controls.reset();
    }

    function buildSolarSystemScene() {
      teardownScene();
      
      if (!solarSystemScene) {
        solarSystemScene = new THREE.Scene();
        solarSystemScene.fog = new THREE.Fog(0x000008, 300, 800);
      }
      currentScene = solarSystemScene;
      camera.position.set(0, 80, 150);
      controls.target.set(0, 0, 0);
      controls.update();

      // Lighting
      const ambient = new THREE.AmbientLight(0x111111);
      solarSystemScene.add(ambient);
      
      const sunLight = new THREE.PointLight(0xFFFFEE, 2.0, 500);
      sunLight.position.set(0, 0, 0);
      solarSystemScene.add(sunLight);

      solarSystemGroup = new THREE.Group();
      solarSystemScene.add(solarSystemGroup);

      // Create bodies
      SOLAR_SYSTEM.forEach(bodyData => {
        createCelestialBody(bodyData, solarSystemGroup, null);
      });

      // Asteroid belt
      createAsteroidBelt();

      // Orbit lines
      SOLAR_SYSTEM.forEach(bodyData => {
        if (bodyData.orbitRadius > 0) {
          createOrbitLine(bodyData.orbitRadius, bodyData.orbitInclination || 0);
        }
      });
    }

    function createCelestialBody(data, parent, parentData) {
      const geometry = new THREE.SphereGeometry(data.radius, 32, 32);
      const material = new THREE.MeshPhongMaterial({
        color: data.color,
        emissive: data.emissive || 0x000000,
        emissiveIntensity: data.emissiveIntensity || 0
      });
      
      const mesh = new THREE.Mesh(geometry, material);
      mesh.userData = { id: data.id, data };
      
      // Load texture
      if (data.textureUrl) {
        new THREE.TextureLoader().load(
          data.textureUrl,
          texture => {
            texture.colorSpace = THREE.SRGBColorSpace;
            material.map = texture;
            material.needsUpdate = true;
          },
          undefined,
          () => {
            // Fallback to solid color on error
            material.color.setHex(data.color);
          }
        );
      }

      // Position on orbit
      if (data.orbitRadius > 0) {
        const angle = Math.random() * Math.PI * 2;
        mesh.position.x = data.orbitRadius * Math.cos(angle);
        mesh.position.z = data.orbitRadius * Math.sin(angle);
        if (data.orbitInclination) {
          mesh.position.y = Math.sin(angle) * data.orbitInclination * 0.3;
        }
      }
      
      // Axial tilt
      if (data.axialTilt) {
        mesh.rotation.z = THREE.MathUtils.degToRad(data.axialTilt);
      }

      parent.add(mesh);
      interactableObjects.push(mesh);
      
      const machine = createObjectMachine(mesh, data);
      objectMachines.set(data.id, machine);

      // Saturn's rings
      if (data.rings) {
        const ringGeo = new THREE.RingGeometry(
          data.rings.innerRadius, data.rings.outerRadius, 64
        );
        const ringMat = new THREE.MeshBasicMaterial({
          color: data.rings.color,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: data.rings.opacity
        });
        
        if (data.rings.textureUrl) {
          new THREE.TextureLoader().load(
            data.rings.textureUrl,
            texture => {
              texture.colorSpace = THREE.SRGBColorSpace;
              ringMat.map = texture;
              ringMat.needsUpdate = true;
            }
          );
        }
        
        const rings = new THREE.Mesh(ringGeo, ringMat);
        rings.rotation.x = Math.PI / 2;
        mesh.add(rings);
      }

      // Moons
      if (data.moons) {
        data.moons.forEach(moonData => {
          createCelestialBody(moonData, mesh, data);
        });
      }

      return mesh;
    }

    function createOrbitLine(radius, inclination = 0) {
      const curve = new THREE.EllipseCurve(0, 0, radius, radius, 0, 2 * Math.PI);
      const points = curve.getPoints(128);
      const geometry = new THREE.BufferGeometry().setFromPoints(
        points.map(p => new THREE.Vector3(p.x, 0, p.y))
      );
      
      if (inclination) {
        geometry.rotateX(THREE.MathUtils.degToRad(inclination));
      }
      
      const material = new THREE.LineBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.15
      });
      
      const orbit = new THREE.Line(geometry, material);
      solarSystemGroup.add(orbit);
      return orbit;
    }

    function createAsteroidBelt() {
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      
      for (let i = 0; i < ASTEROID_BELT.count; i++) {
        const r = ASTEROID_BELT.innerRadius + 
                  Math.random() * (ASTEROID_BELT.outerRadius - ASTEROID_BELT.innerRadius);
        const theta = Math.random() * Math.PI * 2;
        const y = (Math.random() - 0.5) * 1.0;
        
        positions.push(
          r * Math.cos(theta),
          y,
          r * Math.sin(theta)
        );
      }
      
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      
      const material = new THREE.PointsMaterial({
        color: ASTEROID_BELT.color,
        size: 0.15,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.6
      });
      
      asteroidPoints = new THREE.Points(geometry, material);
      solarSystemGroup.add(asteroidPoints);
    }

    function buildGalaxyScene() {
      teardownScene();
      
      if (!galaxyScene) {
        galaxyScene = new THREE.Scene();
        galaxyScene.fog = new THREE.Fog(0x000008, 100, 600);
      }
      currentScene = galaxyScene;
      camera.position.set(0, 150, 200);
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
      controls.update();

      galaxyGroup = new THREE.Group();
      galaxyScene.add(galaxyGroup);

      // Galactic core
      createGalaxyParticles(GALAXY_CONFIG.core, 0, 0, 0, 0.8);
      
      // Spiral arms
      for (let i = 0; i < GALAXY_CONFIG.arms.arms; i++) {
        const angle = (i / GALAXY_CONFIG.arms.arms) * Math.PI * 2;
        createSpiralArm(angle, GALAXY_CONFIG.arms);
      }
      
      // Disk haze
      createGalaxyParticles(GALAXY_CONFIG.disk, 0, 0, 0, 0.3, true);
      
      // Background stars
      createGalaxyParticles(GALAXY_CONFIG.stars, 0, 0, 0, 1, false, true);
      
      // Solar system marker
      createSolarSystemMarker();
    }

    function createGalaxyParticles(config, offsetX, offsetY, offsetZ, opacity, isDisk = false, isSphere = false) {
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      
      for (let i = 0; i < config.count; i++) {
        let x, y, z;
        
        if (isSphere) {
          // Uniform sphere distribution
          const r = config.radius * Math.cbrt(Math.random());
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          x = r * Math.sin(phi) * Math.cos(theta) + offsetX;
          y = r * Math.sin(phi) * Math.sin(theta) + offsetY;
          z = r * Math.cos(phi) + offsetZ;
        } else if (isDisk) {
          // Disk distribution
          const r = 30 + Math.random() * 100;
          const theta = Math.random() * Math.PI * 2;
          x = r * Math.cos(theta) + offsetX;
          z = r * Math.sin(theta) + offsetZ;
          y = (Math.random() - 0.5) * config.height;
        } else {
          // Core distribution
          const r = config.radius * Math.sqrt(Math.random());
          const theta = Math.random() * Math.PI * 2;
          x = r * Math.cos(theta) + offsetX;
          z = r * Math.sin(theta) + offsetZ;
          y = (Math.random() - 0.5) * 5;
        }
        
        positions.push(x, y, z);
      }
      
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      
      const material = new THREE.PointsMaterial({
        color: config.color,
        size: isSphere ? 0.3 : 0.5,
        sizeAttenuation: true,
        transparent: true,
        opacity: opacity
      });
      
      const particles = new THREE.Points(geometry, material);
      galaxyGroup.add(particles);
      
      if (isDisk) galaxyParticles.disk = particles;
      else if (isSphere) galaxyParticles.stars = particles;
      else galaxyParticles.core = particles;
    }

    function createSpiralArm(baseAngle, config) {
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const particlesPerArm = config.count / config.arms;
      
      for (let i = 0; i < particlesPerArm; i++) {
        const t = i / particlesPerArm;
        const r = 20 + t * 80;
        const theta = baseAngle + t * Math.PI * 4 + (Math.random() - 0.5) * config.spread;
        const spread = (Math.random() - 0.5) * 3;
        
        positions.push(
          r * Math.cos(theta) + spread,
          (Math.random() - 0.5) * 1.5,
          r * Math.sin(theta) + spread
        );
      }
      
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      
      const material = new THREE.PointsMaterial({
        color: config.color,
        size: 0.6,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.7
      });
      
      const arm = new THREE.Points(geometry, material);
      galaxyGroup.add(arm);
    }

    function createSolarSystemMarker() {
      // Position in Orion Arm (~60 units from center)
      const markerPos = new THREE.Vector3(60, 0, 25);
      
      // Pulsing glow sphere
      const geometry = new THREE.SphereGeometry(1.5, 16, 16);
      const material = new THREE.MeshBasicMaterial({
        color: 0x6496ff, transparent: true, opacity: 0.9
      });
      const marker = new THREE.Mesh(geometry, material);
      marker.position.copy(markerPos);
      marker.userData = { isMarker: true, pulse: 0 };
      galaxyGroup.add(marker);
      
      // Add to interactables
      interactableObjects.push(marker);
      const machine = createObjectMachine(marker, {
        id: 'solar-marker', name: 'Solar System', type: 'location',
        facts: { location: 'Orion Arm', distance: '26,000 ly from center' }
      });
      objectMachines.set('solar-marker', machine);
      
      // Label (HTML overlay positioned via projection)
      const label = document.createElement('div');
      label.textContent = 'Solar System';
      label.style.cssText = `
        position: absolute; color: #6496ff; font-size: 11px;
        background: rgba(0,0,20,0.7); padding: 3px 6px;
        border: 1px solid rgba(100,150,255,0.4); border-radius: 2px;
        pointer-events: none; transform: translate(-50%, -150%);
      `;
      label.id = 'solar-label';
      document.getElementById('hud').appendChild(label);
      marker.userData.label = label;
    }

    // ==================== ANIMATION LOOP ====================
    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();
      const timeScale = animationMachine.timeScale;
      
      if (currentScene === solarSystemScene) {
        // Animate planets
        SOLAR_SYSTEM.forEach(bodyData => {
          if (bodyData.orbitRadius > 0 && bodyData.orbitPeriod > 0) {
            const mesh = solarSystemGroup.children.find(
              c => c.userData?.data?.id === bodyData.id
            );
            if (mesh) {
              const angle = (elapsed * timeScale / bodyData.orbitPeriod) * Math.PI * 2;
              mesh.position.x = bodyData.orbitRadius * Math.cos(angle);
              mesh.position.z = bodyData.orbitRadius * Math.sin(angle);
              if (bodyData.orbitInclination) {
                mesh.position.y = Math.sin(angle) * bodyData.orbitInclination * 0.3;
              }
            }
          }
          
          // Animate moons
          if (bodyData.moons) {
            const parent = solarSystemGroup.children.find(
              c => c.userData?.data?.id === bodyData.id
            );
            if (parent) {
              bodyData.moons.forEach(moonData => {
                const moon = parent.children.find(
                  c => c.userData?.data?.id === moonData.id
                );
                if (moon && moonData.orbitPeriod > 0) {
                  const angle = (elapsed * timeScale / moonData.orbitPeriod) * Math.PI * 2;
                  moon.position.x = moonData.orbitRadius * Math.cos(angle);
                  moon.position.z = moonData.orbitRadius * Math.sin(angle);
                }
              });
            }
          }
        });
        
        // Rotate asteroid belt
        if (asteroidPoints) {
          asteroidPoints.rotation.y += 0.0003 * timeScale;
        }
        
        // Object detail auto-rotate
        if (viewMachine.state === 'OBJECT_DETAIL' && detailCameraTarget) {
          detailCameraTarget.rotation.y += 0.005;
        }
      }
      
      if (currentScene === galaxyScene) {
        // Pulse solar marker
        const marker = galaxyGroup.children.find(c => c.userData?.isMarker);
        if (marker) {
          marker.userData.pulse = (Math.sin(elapsed * 3) * 0.2 + 0.8);
          marker.material.opacity = marker.userData.pulse;
          marker.scale.setScalar(1 + (1 - marker.userData.pulse) * 0.3);
          
          // Update label position
          updateLabelPosition(marker, marker.userData.label);
        }
        
        // Slow galaxy rotation
        galaxyGroup.rotation.y += 0.0001;
      }
      
      // Raycasting for hover (throttled)
      if (currentScene && !isTransitioning) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactableObjects, true);
        
        // Reset all to IDLE first
        objectMachines.forEach(machine => {
          if (machine.state === 'HOVERED' && !intersects.some(i => i.object === machine.data)) {
            machine.send('MOUSE_LEAVE');
          }
        });
        
        // Handle top intersect
        if (intersects.length > 0) {
          const obj = intersects[0].object;
          const machine = objectMachines.get(obj.userData?.data?.id || obj.userData?.id);
          if (machine && machine.state === 'IDLE') {
            machine.send('MOUSE_ENTER');
          }
        }
      }
      
      controls.update();
      renderer.render(currentScene, camera);
    }

    function updateLabelPosition(obj3d, labelEl) {
      const vec = obj3d.position.clone();
      vec.project(camera);
      
      const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-vec.y * 0.5 + 0.5) * window.innerHeight;
      
      if (vec.z < 1 && vec.z > -1) {
        labelEl.style.left = x + 'px';
        labelEl.style.top = y + 'px';
        labelEl.style.display = 'block';
      } else {
        labelEl.style.display = 'none';
      }
    }

    // ==================== INTERACTION ====================
    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      
      // Update tooltip position
      tooltip.style.left = event.clientX + 'px';
      tooltip.style.top = event.clientY + 'px';
    }

    function onClick(event) {
      if (isTransitioning) return;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactableObjects, true);
      
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        const machine = objectMachines.get(obj.userData?.data?.id || obj.userData?.id);
        
        if (machine) {
          // Deselect previously selected
          objectMachines.forEach(m => {
            if (m.state === 'SELECTED' && m !== machine) {
              m.send('DESELECT');
            }
          });
          machine.send('CLICK');
        } else if (obj.userData?.isMarker) {
          viewMachine.send('ENTER_SOLAR_SYSTEM');
        }
      } else {
        // Clicked empty space - deselect
        objectMachines.forEach(m => {
          if (m.state === 'SELECTED') m.send('DESELECT');
        });
      }
    }

    function showTooltip(text) {
      tooltip.textContent = text;
      tooltip.style.display = 'block';
    }

    function zoomCamera(factor) {
      const direction = new THREE.Vector3();
      camera.getWorldDirection(direction);
      camera.position.add(direction.multiplyScalar(factor > 1 ? 20 : -20));
      controls.update();
    }

    function resetCamera() {
      if (currentScene === solarSystemScene) {
        camera.position.set(0, 80, 150);
        controls.target.set(0, 0, 0);
      } else if (currentScene === galaxyScene) {
        camera.position.set(0, 150, 200);
        controls.target.set(0, 0, 0);
      }
      controls.update();
    }

    // ==================== OBJECT DETAIL VIEW ====================
    function showObjectDetail(data) {
      selectedObjectData = data;
      isTransitioning = true;
      
      // Find the mesh
      let targetMesh = null;
      if (currentScene === solarSystemScene) {
        solarSystemGroup.traverse(obj => {
          if (obj.userData?.data?.id === data.id) {
            targetMesh = obj;
          }
        });
      }
      
      if (!targetMesh) {
        isTransitioning = false;
        return;
      }
      
      detailCameraTarget = targetMesh;
      
      // Store original opacities and fade others
      solarSystemGroup.traverse(obj => {
        if (obj.isMesh && obj.material?.opacity !== undefined) {
          detailOriginalOpacities.set(obj, obj.material.opacity);
          obj.material.transparent = true;
          if (obj !== targetMesh) {
            obj.material.opacity = 0.1;
          }
        }
      });
      
      // Animate camera to object
      const startPos = camera.position.clone();
      const targetPos = targetMesh.getWorldPosition(new THREE.Vector3())
        .add(new THREE.Vector3(0, targetMesh.geometry.parameters.radius * 3, targetMesh.geometry.parameters.radius * 4));
      
      const duration = 1.5;
      let elapsed = 0;
      
      function animateCamera() {
        elapsed += clock.getDelta();
        const t = Math.min(elapsed / duration, 1);
        const eased = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
        
        camera.position.lerpVectors(startPos, targetPos, eased);
        controls.target.copy(targetMesh.getWorldPosition(new THREE.Vector3()));
        controls.update();
        
        if (t < 1) {
          requestAnimationFrame(animateCamera);
        } else {
          isTransitioning = false;
          showInfoPanel(data);
        }
      }
      animateCamera();
    }

    function showInfoPanel(data) {
      document.getElementById('info-name').textContent = data.name;
      document.getElementById('info-type').textContent = 
        data.type.replace('_', ' ').charAt(0).toUpperCase() + data.type.replace('_', ' ').slice(1);
      
      const factsEl = document.getElementById('info-facts');
      factsEl.innerHTML = '';
      
      const factKeys = Object.keys(data.facts).filter(k => k !== 'funFact');
      factKeys.slice(0, 4).forEach(key => {
        const row = document.createElement('div');
        row.className = 'fact';
        row.innerHTML = `
          <span class="fact-key">${key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())}:</span>
          <span class="fact-val">${data.facts[key]}</span>
        `;
        factsEl.appendChild(row);
      });
      
      document.getElementById('info-fun').textContent = data.facts.funFact || '';
      infoPanel.style.display = 'block';
    }

    function hideInfoPanel() {
      infoPanel.style.display = 'none';
      
      // Restore opacities
      detailOriginalOpacities.forEach((opacity, obj) => {
        if (obj.material) {
          obj.material.opacity = opacity;
          if (opacity === 1) obj.material.transparent = false;
        }
      });
      detailOriginalOpacities.clear();
      detailCameraTarget = null;
      selectedObjectData = null;
    }

    // ==================== HUD UPDATES ====================
    function updateHUD() {
      // Navigation buttons
      document.getElementById('btn-galaxy').classList.toggle('hidden', viewMachine.state !== 'SOLAR_SYSTEM');
      document.getElementById('btn-solar').classList.toggle('hidden', viewMachine.state !== 'GALAXY');
      document.getElementById('btn-back').classList.toggle('hidden', viewMachine.state !== 'OBJECT_DETAIL');
      
      // Animation controls
      document.getElementById('anim-controls').classList.toggle('hidden', viewMachine.state !== 'SOLAR_SYSTEM');
      
      // Info panel
      if (viewMachine.state !== 'OBJECT_DETAIL') {
        hideInfoPanel();
      }
    }

    function updateAnimationButtons() {
      document.getElementById('btn-pause').classList.toggle('active', animationMachine.state === 'PAUSED');
      document.getElementById('btn-play').classList.toggle('active', animationMachine.state === 'PLAYING');
      document.getElementById('btn-fast').classList.toggle('active', animationMachine.state === 'FAST');
    }

    // ==================== START ====================
    // Defer init to ensure DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
