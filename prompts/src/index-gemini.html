<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Map - 3D Interactive Galaxy</title>
    <style>
        :root {
            --bg-color: #000008;
            --ui-bg: rgba(0, 0, 10, 0.7);
            --ui-border: rgba(100, 150, 255, 0.3);
            --accent: #4488ff;
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
        }

        canvas { display: block; }

        /* HUD & UI */
        #hud-top {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            pointer-events: none;
        }

        .btn {
            background: var(--ui-bg);
            color: white;
            border: 1px solid var(--ui-border);
            padding: 8px 16px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 14px;
        }

        .btn:hover {
            border-color: white;
            box-shadow: 0 0 10px var(--accent);
        }

        .btn.active {
            background: var(--accent);
            border-color: white;
        }

        #hud-bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        #zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: var(--ui-bg);
            padding: 5px 10px;
            border-radius: 2px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        /* Info Panel */
        #info-panel {
            position: absolute;
            top: 80px;
            left: 20px;
            width: 300px;
            background: var(--ui-bg);
            border: 1px solid var(--ui-border);
            padding: 20px;
            display: none;
            animation: fadeIn 0.3s;
        }

        #info-panel h2 { margin-top: 0; color: var(--accent); }
        .fact-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .fact-label { color: #aaa; }
        .fun-fact { margin-top: 15px; font-style: italic; font-size: 12px; border-top: 1px solid var(--ui-border); padding-top: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="tooltip"></div>

    <div id="hud-top">
        <div style="font-size: 20px; font-weight: bold; pointer-events: auto;">★ STAR MAP</div>
        <div>
            <button id="btn-galaxy" class="btn hidden">🌌 Galaxy View</button>
            <button id="btn-solar" class="btn hidden">☀️ Solar System</button>
            <button id="btn-back" class="btn hidden">← Back</button>
        </div>
    </div>

    <div id="info-panel">
        <h2 id="info-name">Earth</h2>
        <div id="info-type" style="margin-bottom: 15px; font-size: 12px; opacity: 0.7;">Planet</div>
        <div id="info-facts"></div>
        <div id="info-fun" class="fun-fact"></div>
    </div>

    <div id="hud-bottom" class="hidden">
        <button id="btn-pause" class="btn">⏸ Pause</button>
        <button id="btn-play" class="btn active">▶ Play</button>
        <button id="btn-fast" class="btn">⏩ Fast</button>
    </div>

    <div id="zoom-controls">
        <button id="btn-zoom-in" class="btn">[+]</button>
        <button id="btn-zoom-out" class="btn">[-]</button>
        <button id="btn-reset" class="btn">[⟳]</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        /** * DATA CONFIGURATION
         */
        const SOLAR_SYSTEM = [
            {
                id: 'sun', name: 'The Sun', type: 'star', radius: 5, color: 0xFDB813,
                emissive: 0xFDB813, emissiveIntensity: 1.0, orbitRadius: 0, orbitPeriod: 0, axialTilt: 7.25,
                textureUrl: 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/sun.jpg',
                facts: { diameter: '1,392,700 km', mass: '1.989 × 10³⁰ kg', surfaceTemp: '5,500 °C', type: 'G-type Star', funFact: 'The Sun contains 99.86% of the mass in the solar system.' }
            },
            {
                id: 'mercury', name: 'Mercury', type: 'planet', radius: 0.38, color: 0xB5B5B5,
                orbitRadius: 8, orbitPeriod: 0.24, axialTilt: 0.03,
                facts: { diameter: '4,879 km', dayLength: '58.6 Earth days', distanceFromSun: '57.9M km', moons: 0, funFact: 'Mercury has no atmosphere and extreme temperature swings.' }
            },
            {
                id: 'venus', name: 'Venus', type: 'planet', radius: 0.95, color: 0xE8C56B,
                orbitRadius: 14, orbitPeriod: 0.62, axialTilt: 177.4,
                facts: { diameter: '12,104 km', dayLength: '243 Earth days', distanceFromSun: '108.2M km', moons: 0, funFact: 'Venus rotates backwards and is the hottest planet.' }
            },
            {
                id: 'earth', name: 'Earth', type: 'planet', radius: 1.0, color: 0x2E6DB4,
                orbitRadius: 20, orbitPeriod: 1.0, axialTilt: 23.44,
                textureUrl: 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg',
                moons: [{ id: 'moon', name: 'The Moon', radius: 0.27, color: 0xAAAAAA, orbitRadius: 2.5, orbitPeriod: 0.075, facts: { diameter: '3,474 km', funFact: 'Slowly drifting away from Earth.' } }],
                facts: { diameter: '12,756 km', dayLength: '24 hours', distanceFromSun: '149.6M km', moons: 1, funFact: 'The only known planet with life.' }
            },
            {
                id: 'mars', name: 'Mars', type: 'planet', radius: 0.53, color: 0xC1440E,
                orbitRadius: 28, orbitPeriod: 1.88, axialTilt: 25.19,
                facts: { diameter: '6,792 km', dayLength: '24.6 hours', distanceFromSun: '227.9M km', moons: 2, funFact: 'Home to Olympus Mons, the tallest volcano.' }
            },
            {
                id: 'jupiter', name: 'Jupiter', type: 'planet', radius: 3.5, color: 0xC88B3A,
                orbitRadius: 52, orbitPeriod: 11.86, axialTilt: 3.13,
                facts: { diameter: '142,984 km', dayLength: '9.9 hours', distanceFromSun: '778.5M km', moons: 95, funFact: 'The Great Red Spot is a storm larger than Earth.' }
            },
            {
                id: 'saturn', name: 'Saturn', type: 'planet', radius: 3.0, color: 0xEAD6A3,
                orbitRadius: 88, orbitPeriod: 29.46, axialTilt: 26.73,
                rings: { innerRadius: 3.8, outerRadius: 6.5, color: 0xC8A96B, opacity: 0.6 },
                facts: { diameter: '120,536 km', dayLength: '10.7 hours', distanceFromSun: '1.43B km', moons: 146, funFact: 'Saturn would float in water.' }
            },
            {
                id: 'uranus', name: 'Uranus', type: 'planet', radius: 2.0, color: 0x7DE8E8,
                orbitRadius: 120, orbitPeriod: 84.01, axialTilt: 97.77,
                facts: { diameter: '51,118 km', dayLength: '17.2 hours', distanceFromSun: '2.87B km', moons: 28, funFact: 'Rotates on its side.' }
            },
            {
                id: 'neptune', name: 'Neptune', type: 'planet', radius: 1.9, color: 0x3F54BA,
                orbitRadius: 152, orbitPeriod: 164.8, axialTilt: 28.32,
                facts: { diameter: '49,528 km', dayLength: '16.1 hours', distanceFromSun: '4.50B km', moons: 16, funFact: 'Fastest winds in the solar system.' }
            }
        ];

        const ASTEROID_BELT = { innerRadius: 35, outerRadius: 48, count: 3000, color: 0x888888 };

        /**
         * STATE MACHINES
         */
        const viewMachine = {
            state: 'GALAXY',
            transitions: {
                GALAXY: { ENTER_SOLAR_SYSTEM: 'SOLAR_SYSTEM' },
                SOLAR_SYSTEM: { ZOOM_TO_GALAXY: 'GALAXY', SELECT_OBJECT: 'OBJECT_DETAIL' },
                OBJECT_DETAIL: { BACK: 'SOLAR_SYSTEM', SELECT_OBJECT: 'OBJECT_DETAIL' }
            },
            send(event, payload) {
                const next = this.transitions[this.state]?.[event];
                if (!next) return;
                const prev = this.state;
                this.state = next;
                this.onEnter(next, prev, payload);
            },
            onEnter(state, prev, payload) {
                updateUI();
                if (state === 'SOLAR_SYSTEM' && prev === 'GALAXY') buildSolarSystem();
                if (state === 'GALAXY') buildGalaxy();
                if (state === 'OBJECT_DETAIL') focusObject(payload);
                if (state === 'SOLAR_SYSTEM' && prev === 'OBJECT_DETAIL') resetFocus();
            }
        };

        const animationMachine = {
            state: 'PLAYING',
            timeScale: 1,
            send(event) {
                if (event === 'PAUSE') { this.state = 'PAUSED'; this.timeScale = 0; }
                if (event === 'PLAY') { this.state = 'PLAYING'; this.timeScale = 1; }
                if (event === 'SPEED_UP') { this.state = 'FAST'; this.timeScale = 10; }
                updateUI();
            }
        };

        /**
         * CORE THREE.JS SETUP
         */
        let scene, camera, renderer, controls, raycaster, mouse;
        let interactableObjects = [];
        let solarSystemGroup, galaxyGroup;
        let clock = new THREE.Clock();
        let hoveredObject = null;
        let selectedObject = null;
        let orbitLines = [];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);

            setupUIEvents();
            viewMachine.onEnter('GALAXY'); // Start
            animate();
        }

        /**
         * SCENE BUILDERS
         */
        function buildGalaxy() {
            clearScene();
            galaxyGroup = new THREE.Group();
            
            // Core
            const coreGeom = new THREE.BufferGeometry();
            const corePos = [];
            for(let i=0; i<20000; i++) {
                const r = Math.random() * 15;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                corePos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi) * 0.5, r * Math.sin(phi) * Math.sin(theta));
            }
            coreGeom.setAttribute('position', new THREE.Float32BufferAttribute(corePos, 3));
            const coreMat = new THREE.PointsMaterial({ color: 0xFFEECC, size: 0.1, transparent: true, opacity: 0.6 });
            galaxyGroup.add(new THREE.Points(coreGeom, coreMat));

            // Arms (Logarithmic Spirals)
            const armCount = 4;
            const ptsPerArm = 15000;
            const armPos = [];
            for (let j = 0; j < armCount; j++) {
                for (let i = 0; i < ptsPerArm; i++) {
                    const r = Math.random() * 100 + 10;
                    const angle = (r * 0.1) + (j * (Math.PI * 2 / armCount)) + (Math.random() * 0.5);
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    const y = (Math.random() - 0.5) * (10 / (r * 0.1));
                    armPos.push(x, y, z);
                }
            }
            const armGeom = new THREE.BufferGeometry();
            armGeom.setAttribute('position', new THREE.Float32BufferAttribute(armPos, 3));
            const armMat = new THREE.PointsMaterial({ color: 0xAABBFF, size: 0.08, transparent: true, opacity: 0.4 });
            galaxyGroup.add(new THREE.Points(armGeom, armMat));

            // Solar System Marker
            const markerGeom = new THREE.SphereGeometry(1.5, 16, 16);
            const markerMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const marker = new THREE.Mesh(markerGeom, markerMat);
            marker.position.set(50, 0, 30);
            marker.userData = { type: 'MARKER', id: 'solar-entry', name: 'Solar System' };
            galaxyGroup.add(marker);
            interactableObjects.push(marker);

            // Stars Background
            const starGeom = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<10000; i++) {
                const r = 800;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                starPos.push(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            }
            starGeom.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            galaxyGroup.add(new THREE.Points(starGeom, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 })));

            scene.add(galaxyGroup);
            camera.position.set(100, 100, 150);
            controls.target.set(0, 0, 0);
        }

        function buildSolarSystem() {
            clearScene();
            solarSystemGroup = new THREE.Group();
            
            // Lighting
            const sunLight = new THREE.PointLight(0xFFFFEE, 2, 500);
            solarSystemGroup.add(sunLight);
            solarSystemGroup.add(new THREE.AmbientLight(0x222222));

            const loader = new THREE.TextureLoader();

            SOLAR_SYSTEM.forEach(data => {
                const group = new THREE.Group();
                
                // Body
                const geom = new THREE.SphereGeometry(data.radius, 32, 32);
                const mat = new THREE.MeshPhongMaterial({ 
                    color: data.color,
                    emissive: data.emissive || 0x000000,
                    emissiveIntensity: data.emissiveIntensity || 0
                });

                if (data.textureUrl) {
                    loader.load(data.textureUrl, (tex) => { mat.map = tex; mat.needsUpdate = true; });
                }

                const mesh = new THREE.Mesh(geom, mat);
                mesh.userData = { ...data };
                group.add(mesh);
                interactableObjects.push(mesh);

                // Orbit Line
                if (data.orbitRadius > 0) {
                    const curve = new THREE.EllipseCurve(0, 0, data.orbitRadius, data.orbitRadius);
                    const pts = curve.getPoints(128);
                    const orbGeom = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p.x, 0, p.y)));
                    const orbMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
                    const orbitLine = new THREE.Line(orbGeom, orbMat);
                    solarSystemGroup.add(orbitLine);
                    orbitLines.push(orbitLine);
                }

                // Moons
                if (data.moons) {
                    data.moons.forEach(m => {
                        const mGeom = new THREE.SphereGeometry(m.radius, 16, 16);
                        const mMat = new THREE.MeshPhongMaterial({ color: m.color });
                        const mMesh = new THREE.Mesh(mGeom, mMat);
                        mMesh.userData = { ...m, isMoon: true, parentId: data.id };
                        group.add(mMesh);
                        interactableObjects.push(mMesh);
                    });
                }

                // Rings
                if (data.rings) {
                    const rGeom = new THREE.RingGeometry(data.rings.innerRadius, data.rings.outerRadius, 64);
                    const rMat = new THREE.MeshBasicMaterial({ color: data.rings.color, side: THREE.DoubleSide, transparent: true, opacity: data.rings.opacity });
                    const ring = new THREE.Mesh(rGeom, rMat);
                    ring.rotation.x = Math.PI / 2;
                    group.add(ring);
                }

                solarSystemGroup.add(group);
            });

            // Asteroid Belt
            const astPos = [];
            for (let i = 0; i < ASTEROID_BELT.count; i++) {
                const r = ASTEROID_BELT.innerRadius + Math.random() * (ASTEROID_BELT.outerRadius - ASTEROID_BELT.innerRadius);
                const a = Math.random() * Math.PI * 2;
                astPos.push(Math.cos(a) * r, (Math.random() - 0.5) * 1, Math.sin(a) * r);
            }
            const astGeom = new THREE.BufferGeometry();
            astGeom.setAttribute('position', new THREE.Float32BufferAttribute(astPos, 3));
            solarSystemGroup.add(new THREE.Points(astGeom, new THREE.PointsMaterial({ color: 0x888888, size: 0.1 })));

            scene.add(solarSystemGroup);
            camera.position.set(0, 100, 200);
            controls.target.set(0, 0, 0);
        }

        function clearScene() {
            while(scene.children.length > 0) { 
                const obj = scene.children[0];
                scene.remove(obj);
            }
            interactableObjects = [];
            orbitLines = [];
        }

        /**
         * ANIMATION & LOGIC
         */
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            if (viewMachine.state === 'GALAXY') {
                galaxyGroup.rotation.y += 0.001;
                // Pulse marker
                const marker = interactableObjects.find(o => o.userData.type === 'MARKER');
                if (marker) marker.scale.setScalar(1 + Math.sin(elapsed * 3) * 0.1);
            }

            if (solarSystemGroup && (animationMachine.state !== 'PAUSED' || viewMachine.state === 'OBJECT_DETAIL')) {
                const t = elapsed * animationMachine.timeScale;
                
                solarSystemGroup.children.forEach(child => {
                    if (child.type === 'Group') {
                        const mesh = child.children[0];
                        const data = mesh.userData;
                        
                        if (data.orbitRadius > 0) {
                            const angle = t * (1 / data.orbitPeriod) * 0.2;
                            child.position.x = Math.cos(angle) * data.orbitRadius;
                            child.position.z = Math.sin(angle) * data.orbitRadius;
                        }

                        // Rotate planets
                        mesh.rotation.y += 0.005;

                        // Moons
                        child.children.forEach(grandchild => {
                            if (grandchild.userData.isMoon) {
                                const mData = grandchild.userData;
                                const mAngle = t * (1 / mData.orbitPeriod) * 0.2;
                                grandchild.position.x = Math.cos(mAngle) * mData.orbitRadius;
                                grandchild.position.z = Math.sin(mAngle) * mData.orbitRadius;
                            }
                        });
                    }
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        /**
         * INTERACTIONS
         */
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);

            const tooltip = document.getElementById('tooltip');
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (hoveredObject !== obj) {
                    if (hoveredObject) hoveredObject.material.emissiveIntensity = hoveredObject.userData.emissiveIntensity || 0;
                    hoveredObject = obj;
                    hoveredObject.material.emissive = new THREE.Color(0xffffff);
                    hoveredObject.material.emissiveIntensity = 0.3;
                    document.body.style.cursor = 'pointer';
                }
                tooltip.style.display = 'block';
                tooltip.style.left = (event.clientX + 15) + 'px';
                tooltip.style.top = (event.clientY + 15) + 'px';
                tooltip.innerText = obj.userData.name;
            } else {
                if (hoveredObject) {
                    hoveredObject.material.emissiveIntensity = hoveredObject.userData.emissiveIntensity || 0;
                    hoveredObject = null;
                }
                tooltip.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        }

        function onClick() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);

            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj.userData.type === 'MARKER') {
                    viewMachine.send('ENTER_SOLAR_SYSTEM');
                } else {
                    viewMachine.send('SELECT_OBJECT', obj);
                }
            }
        }

        function focusObject(obj) {
            selectedObject = obj;
            animationMachine.send('PAUSE');
            
            // UI
            const panel = document.getElementById('info-panel');
            panel.style.display = 'block';
            document.getElementById('info-name').innerText = obj.userData.name;
            document.getElementById('info-type').innerText = obj.userData.type.toUpperCase();
            
            let factsHtml = '';
            for (const [key, value] of Object.entries(obj.userData.facts || {})) {
                if (key === 'funFact') {
                    document.getElementById('info-fun').innerText = value;
                } else {
                    factsHtml += `<div class="fact-row"><span class="fact-label">${key}</span><span>${value}</span></div>`;
                }
            }
            document.getElementById('info-facts').innerHTML = factsHtml;

            // Camera positioning
            const distance = obj.userData.radius * 4;
            const pos = new THREE.Vector3();
            obj.getWorldPosition(pos);
            
            // Simple camera fly
            camera.position.set(pos.x + distance, pos.y + distance/2, pos.z + distance);
            controls.target.copy(pos);

            // Fade others
            solarSystemGroup.children.forEach(c => {
                c.traverse(child => {
                    if (child.material) {
                        child.material.transparent = true;
                        child.material.opacity = (child === obj || child.parent === obj) ? 1.0 : 0.1;
                    }
                });
            });
            orbitLines.forEach(l => l.visible = false);
        }

        function resetFocus() {
            selectedObject = null;
            document.getElementById('info-panel').style.display = 'none';
            animationMachine.send('PLAY');
            
            solarSystemGroup.children.forEach(c => {
                c.traverse(child => {
                    if (child.material) {
                        child.material.opacity = 1.0;
                    }
                });
            });
            orbitLines.forEach(l => l.visible = true);
            controls.target.set(0,0,0);
        }

        function updateUI() {
            const state = viewMachine.state;
            document.getElementById('btn-galaxy').classList.toggle('hidden', state !== 'SOLAR_SYSTEM');
            document.getElementById('btn-solar').classList.toggle('hidden', state !== 'GALAXY');
            document.getElementById('btn-back').classList.toggle('hidden', state !== 'OBJECT_DETAIL');
            document.getElementById('hud-bottom').classList.toggle('hidden', state === 'GALAXY');

            document.getElementById('btn-pause').classList.toggle('active', animationMachine.state === 'PAUSED');
            document.getElementById('btn-play').classList.toggle('active', animationMachine.state === 'PLAYING');
            document.getElementById('btn-fast').classList.toggle('active', animationMachine.state === 'FAST');
        }

        function setupUIEvents() {
            document.getElementById('btn-galaxy').onclick = () => viewMachine.send('ZOOM_TO_GALAXY');
            document.getElementById('btn-solar').onclick = () => viewMachine.send('ENTER_SOLAR_SYSTEM');
            document.getElementById('btn-back').onclick = () => viewMachine.send('BACK');
            
            document.getElementById('btn-pause').onclick = () => animationMachine.send('PAUSE');
            document.getElementById('btn-play').onclick = () => animationMachine.send('PLAY');
            document.getElementById('btn-fast').onclick = () => animationMachine.send('SPEED_UP');

            document.getElementById('btn-zoom-in').onclick = () => {
                camera.position.multiplyScalar(0.8);
            };
            document.getElementById('btn-zoom-out').onclick = () => {
                camera.position.multiplyScalar(1.2);
            };
            document.getElementById('btn-reset').onclick = () => {
                if (viewMachine.state === 'GALAXY') camera.position.set(100, 100, 150);
                else camera.position.set(0, 100, 200);
                controls.target.set(0,0,0);
            };
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
